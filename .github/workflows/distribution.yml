name: Standalone distribution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/distribution.yml'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'apps/zcode-cli/**'

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ZCODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.2
      # 版本号从根 package.json 读取，避免工作流里写死某个发行版本；换版本时只改 package.json 即可。
      - name: Resolve release version
        shell: bash
        run: echo "ZCODE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Install workspace
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Launcher and installer regression tests
        run: pnpm test:distribution
      - name: Check types
        run: pnpm typecheck
      - name: Lint retained application sources
        run: pnpm lint
      - name: Build standalone runtime
        run: pnpm build:zcode --base-url https://github.com/Alice-Marx/zcode-cli/releases/latest/download
      - name: Browser handoff and login regression tests
        run: |
          pnpm --filter @zcode/adapters exec vitest run tests/auth-browser.test.ts tests/auth.test.ts
          pnpm --filter @zcode/bootstrap exec vitest run tests/auth-login.test.ts
          pnpm --filter @zcode/cli exec node --import tsx --test tests/tui-login-polling.test.ts
      - name: Verify real archive and metadata
        run: pnpm test:distribution
      - name: Smoke TUI and Web outside checkout
        run: pnpm smoke:distribution "dist/zcode/releases/${{ env.ZCODE_VERSION }}/zcode-${{ env.ZCODE_VERSION }}.tar.gz"
      - name: Save runtime
        uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ runner.os }}-${{ runner.arch }}
          path: dist/zcode/
          retention-days: 7
