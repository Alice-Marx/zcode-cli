name: Upstream ZCode notifications

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/scripts/upstream-watch*.mjs'
      - '.github/upstream-watch-baseline.json'
      - 'upstream.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-zcode-notifications
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository == 'Alice-Marx/zcode-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test notification and retry behavior
        run: node --test .github/scripts/upstream-watch.test.mjs
      - name: Check upstream and maintain notification issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/upstream-watch.mjs
