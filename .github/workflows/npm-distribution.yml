name: npm distribution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/npm-distribution.yml'
      - 'distribution/npm/**'
      - 'scripts/build-npm.mjs'
      - 'scripts/npm-command.mjs'
      - 'scripts/zcode-npm-smoke.mjs'

permissions:
  contents: read

concurrency:
  group: npm-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      # 版本号从 npm 模板读取，避免工作流里写死某个发行版本；换版本时只改模板即可。
      - name: Resolve release version
        shell: bash
        run: echo "ZCODE_VERSION=$(node -p "require('./distribution/npm/package.json').version")" >> "$GITHUB_ENV"
      - name: Install extraction library for fixture tests
        run: npm ci --prefix distribution/npm --ignore-scripts --no-audit --no-fund
      - name: Installer unit tests
        run: npm test --prefix distribution/npm
      - name: Download reviewed runtime candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${{ env.ZCODE_VERSION }}" --repo ${{ github.repository }} --pattern "zcode-${{ env.ZCODE_VERSION }}.tar.gz" --dir "dist/zcode/releases/${{ env.ZCODE_VERSION }}"
      - name: Build exact npm payload
        run: npm run build:npm -- --download
      - name: Review npm dry run
        run: npm publish "./dist/npm/${{ env.ZCODE_VERSION }}/ljwei-stak-zcode-cli-${{ env.ZCODE_VERSION }}.tgz" --access public --dry-run --json
      - name: Install actual npm tgz and smoke TUI and Web
        run: npm run smoke:npm -- "./dist/npm/${{ env.ZCODE_VERSION }}/ljwei-stak-zcode-cli-${{ env.ZCODE_VERSION }}.tgz"
      - name: Save npm artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: npm-evidence-${{ runner.os }}
          path: dist/npm/${{ env.ZCODE_VERSION }}/package-info.json
          retention-days: 7
